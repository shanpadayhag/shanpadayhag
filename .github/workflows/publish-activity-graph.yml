name: Publish activity graph

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-activity-graph.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Check out original graph renderer
        uses: actions/checkout@v6
        with:
          repository: Ashutosh00710/github-readme-activity-graph
          ref: 0962e9461de815933d462e8b98c7ce566cada8fb
          path: renderer
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: renderer/package-lock.json
      - name: Build original graph renderer
        working-directory: renderer
        run: npm ci && npm run build
      - name: Render activity graph SVG
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          (cd renderer && npm start) > renderer.log 2>&1 &
          until curl --silent --fail http://127.0.0.1:5100/ >/dev/null; do sleep 1; done
          curl --silent --show-error --fail \
            "http://127.0.0.1:5100/graph?username=shanpadayhag&theme=tokyo-night&hide_border=true" \
            -o site/activity.svg
          grep -q "Contribution Graph" site/activity.svg
          touch site/.nojekyll
          printf '<main><img src="activity.svg" alt="GitHub activity graph"></main>\n' > site/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
