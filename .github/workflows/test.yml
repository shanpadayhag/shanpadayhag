name: Test activity graph

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Python tests
        run: python -m unittest discover -s tests -v

  live-accuracy:
    if: github.event_name == 'workflow_dispatch'
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare daily counts with the GitHub profile heat map
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_LIVE_GITHUB_TESTS: "1"
        run: python -m unittest tests/test_live_github_accuracy.py -v
